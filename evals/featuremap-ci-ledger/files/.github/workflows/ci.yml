name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Ruby tests
        run: ruby -Igems/core/lib -Igems/api/lib -Igems/admin/lib -e 'ARGV.each { |f| require File.expand_path(f) }' tests/ruby/*_test.rb
      - name: Python tests
        run: PYTHONPATH=jobs python3 -m unittest discover -s tests/python
      - name: Engine
        run: cargo check --quiet --manifest-path engine/Cargo.toml
      - name: Native
        run: cmake -S native -B build && cmake --build build
