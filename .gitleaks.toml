# Use the default gitleaks rules. Do not allowlist a whole path. If a fixture
# trips a rule, allowlist that exact value.
[extend]
useDefault = true

[allowlist]
description = "The fake supplier token of the eval case leaving-pr-comments-secret"
regexes = ['''sup_live_Hq7Vd2Lx9Pw4Ka8Zt3Nc6Rb1Mf5Jy''']

[[rules]]
id = "home-folder-path"
description = "A path in a user home folder"
regex = '''((?i:https?)://(\[[0-9A-Fa-f:.]+\]|[^/\s"',;<>()|`\\{}\[\]]+)([^\s"',;<>()|`\\{}\[\]]|\([^\s"',;<>()|`\\{}\[\]]*\))*)?([a-zA-Z]:)?(/|\\{1,2})((?i:users)|home|root)(/|\\{1,2})([\p{L}\p{N}._-]|%[0-9A-Fa-f]{2})+'''

[[rules.allowlists]]
description = "The shared and public system folders"
regexTarget = "match"
regexes = ['''(?i)[/\\](shared|public|default)\.*$''']

[[rules.allowlists]]
description = "A web URL with a home-like path"
regexTarget = "match"
regexes = ['''^(?i:https?)://[^/]''']
