name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          probe() {
            echo "== $1 token"
            curl -sS -D hdr.txt -o body.json -H "Authorization: Bearer $GH_TOKEN" -H 'User-Agent: sentinel-upstream' "https://api.github.com/repos/$1" || true
            grep -iE '^(HTTP|x-accepted|x-ratelimit-(remaining|resource))' hdr.txt || true
            head -c 300 body.json; echo
            echo "== $1 anonymous: $(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: sentinel-upstream' "https://api.github.com/repos/$1")"
          }
          probe 'anthropics/skills/git/trees/dbd4588f9e1033efb41dad4bef2f7947c8993d44?recursive=1'
          probe 'cursor/plugins/git/trees/d42aff08aa58965d2735c4ead61a9af82b89d0d0?recursive=1'
          probe 'cursor/plugins/git/trees/4dd1d05818d19792e7cd6e818f1667f95f7e1dbe'
          probe 'cursor/plugins/commits/main'
          probe 'cursor/plugins/contents/README.md'
